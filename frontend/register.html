<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Cloud Help Desk System</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg-primary);
    }
    .auth-card {
      background-color: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-md);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div style="font-size: 32px; color: var(--color-amber); margin-bottom: 8px;">⚡</div>
        <h2 style="font-size: 20px; font-weight: 800; color: var(--color-espresso);">Create Account</h2>
        <p style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">Get started with Cloud Help Desk</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="e.g. Jane Doe" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="jane@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="department">Department / Team</label>
          <input type="text" id="department" class="form-control" placeholder="e.g. Operations">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px 16px; margin-top: 8px; font-size: 14px;">
          Sign Up
        </button>
      </form>

      <div style="text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-secondary);">
        Already have an account? <a href="login.html">Log in here</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const department = document.getElementById('department').value;
      const password = document.getElementById('password').value;
      handleRegister(name, email, password, department);
    });
  </script>
</body>
</html>
